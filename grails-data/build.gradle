// Grails Data used as a plain library: no Grails application, no Spring Boot.

apply plugin: 'application'

dependencies {
    implementation "org.apache.grails.data:grails-data-hibernate7-core:$grailsDataVersion"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'grailsdata.LibraryApp'
}

// the shared JPA-annotated entities, compiled unchanged
sourceSets.test.groovy.srcDir rootProject.file('model/src/main/groovy')

tasks.withType(Test).configureEach {
    // GORM's static API registration is per JVM
    forkEvery = 1
}
