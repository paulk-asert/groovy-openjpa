// Build-time enhancement: run OpenJPA's PCEnhancer over the groovyc output,
// rewriting the entity class files in place.
def enhance = tasks.register('enhance', JavaExec) {
    def classesDir = sourceSets.main.groovy.destinationDirectory
    dependsOn tasks.named('compileGroovy'), tasks.named('processResources')
    classpath = files(classesDir, sourceSets.main.output.resourcesDir) + configurations.runtimeClasspath
    mainClass = 'org.apache.openjpa.enhance.PCEnhancer'
    // with no class arguments, PCEnhancer enhances the classes listed in persistence.xml
    args '-d', classesDir.get().asFile.absolutePath
    // rewrites compileGroovy's output in place, so don't declare it as input/output
    outputs.upToDateWhen { false }
}
tasks.named('classes') { dependsOn enhance }
