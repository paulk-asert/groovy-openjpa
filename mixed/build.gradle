// The shared entities enhanced and persisted by OpenJPA, with GORM building the queries.

dependencies {
    implementation "org.apache.openjpa:openjpa:$openjpaVersion"
    implementation "org.apache.grails.data:grails-datamapping-core:$grailsDataVersion"
    implementation "org.apache.grails.data:grails-data-simple:$grailsDataVersion"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets.main.groovy.srcDir rootProject.file('model/src/main/groovy')

apply from: rootProject.file('gradle/enhance.gradle')

tasks.withType(Test).configureEach {
    // GORM's static API registration is per JVM
    forkEvery = 1
}
